name: CI

# Pull requests run this directly; pushes to main run it through the release workflow.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides whether the test jobs run. A change that only touches docs (Markdown,
  # LICENSE, .github/assets) can't change a test result, so it skips the test matrix;
  # quality still runs, since it checks the Markdown's formatting. Anything else,
  # a manual run, or a diff that can't be worked out runs everything.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          case "$EVENT" in
            pull_request) range="$PR_BASE...$PR_HEAD" ;;
            push) range="$PUSH_BEFORE..$PUSH_AFTER" ;;
            *) range="" ;;
          esac
          code=true
          if [ -n "$range" ] && files=$(git diff --name-only "$range" 2>/dev/null) && [ -n "$files" ]; then
            if ! printf '%s\n' "$files" | grep -Evq '(^|/)[^/]+\.md$|^LICENSE$|^\.github/assets/'; then
              code=false
            fi
          fi
          printf '%s\n' "$files"
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  quality:
    name: Quality (lint, types, format, package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm check:package
      - name: cliprobe passes its own check
        run: node dist/cli.js -- node dist/cli.js --help

  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test with coverage
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: pnpm test:coverage
      - name: Test
        if: matrix.os != 'ubuntu-latest' || matrix.node != 24
        run: pnpm test

  alpine:
    name: Test (Alpine, Node 22)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Runs the suite inside node:22-alpine (musl, BusyBox) rather than as a job
      # container, where the runner's own Node and JavaScript actions don't run.
      # script(1) comes from util-linux-misc; GNU tools match the real-tool tests.
      - name: Run the tests in node:22-alpine
        run: |
          docker run --rm -v "$PWD:/src:ro" node:22-alpine sh -euc '
            apk add --no-cache util-linux-misc coreutils findutils procps grep git
            npm install --global "$(node -p "require(\"/src/package.json\").packageManager")"
            cp -r /src /work && cd /work
            pnpm install --frozen-lockfile
            pnpm test
          '
