name: Accessibility barrier
description: Something in cliprobe or its documentation is hard or impossible to use with the way you work.
title: '[a11y] '
labels: [accessibility]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for telling us. [ACCESSIBILITY.md](https://github.com/KhaledSaeed18/cliprobe/blob/main/ACCESSIBILITY.md) describes what cliprobe aims for and its known limitations. Share only what you're comfortable sharing; if you'd rather report privately, email the address in that file.

  - type: textarea
    id: barrier
    attributes:
      label: The barrier
      description: What you were trying to do, and what got in the way.
    validations:
      required: true

  - type: textarea
    id: setup
    attributes:
      label: What you use
      description: For example a screen reader or braille display and its version, a magnifier, a terminal emulator, a color scheme, or a keyboard-only setup.

  - type: textarea
    id: command
    attributes:
      label: Command
      description: The cliprobe command, if the barrier is in its output.
      render: shell

  - type: textarea
    id: better
    attributes:
      label: What would work better
      description: Optional. How the output or documentation could work for you.
