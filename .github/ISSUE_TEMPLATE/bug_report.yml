name: Bug report
description: cliprobe itself crashed, hung, printed something wrong or left something behind.
title: '[bug] '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for problems in cliprobe itself. If a check gave the wrong verdict for a program, use the **Wrong verdict** form instead. For security issues, follow the [security policy](https://github.com/KhaledSaeed18/cliprobe/security/policy) and don't open an issue.

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What cliprobe did, including any error message.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Command
      description: The exact cliprobe command, so it can be run again.
      placeholder: npx cliprobe@latest --format junit -o report.xml -- mytool --help
      render: shell
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Output
      description: Everything cliprobe printed, on stdout and stderr, and its exit code (`echo $?`).
      render: text

  - type: input
    id: cliprobe-version
    attributes:
      label: cliprobe version
      description: Output of `cliprobe --version`.
      placeholder: 1.2.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux (glibc, e.g. Ubuntu or Debian)
        - Linux (musl, e.g. Alpine)
        - Other
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of `node --version`.
      placeholder: v22.12.0
    validations:
      required: true

  - type: dropdown
    id: where
    attributes:
      label: Where it ran
      options:
        - A local terminal
        - CI (GitHub Actions, GitLab CI or another)
        - A container
        - Other
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: The CI provider, the terminal emulator, or anything that seems related.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I reproduced this with the latest cliprobe release.
          required: true
        - label: I searched existing issues.
          required: true
