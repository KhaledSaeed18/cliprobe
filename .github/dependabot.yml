# Dependency updates: at most one grouped pull request per group, once a week.
#
# cliprobe has no runtime dependencies, so every npm update is a dev dependency.
# Commit types are chosen so that merging an update never publishes to npm:
# semantic-release releases only on feat and fix, and these use build and ci.
# Merge with "rebase and merge", like any other pull request.
version: 2

updates:
  - package-ecosystem: npm # reads pnpm-lock.yaml and updates it with pnpm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    # Skip versions published in the last week, so a bad or compromised release
    # has time to be pulled before it reaches the lockfile.
    cooldown:
      default-days: 7
    # Move the ranges in package.json along with the lockfile.
    versioning-strategy: increase
    commit-message:
      prefix: build
      prefix-development: build
      include: scope # build(deps-dev): ...
    groups:
      # Minor and patch updates: one pull request, usually a straight merge.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      # Major updates: a second pull request, since they may need code changes.
      dev-dependencies-major:
        dependency-type: development
        update-types: [major]
      # If security updates are turned on, batch them as well.
      security:
        applies-to: security-updates
        patterns: ['*']
    ignore:
      # The types must match the oldest supported Node (engines: >=22.12.0),
      # or code could use APIs that Node 22 lacks.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # Preset 10 needs conventional-changelog-writer 9, and the latest
      # @semantic-release/release-notes-generator (14.1.1) still uses writer 8,
      # so it would break the release notes. Drop this once a stable generator
      # supports it; test/release-config.test.ts fails if it is still too early.
      - dependency-name: conventional-changelog-conventionalcommits
        versions: ['>=10']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope # ci(deps): ...
    groups:
      github-actions:
        patterns: ['*']
